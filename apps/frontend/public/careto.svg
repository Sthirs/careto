<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Carèo – carrello della spesa (tre quarti)</title>

  <g transform="translate(512 0) scale(-1 1)">
  <!-- Terreno -->
  <rect x="112" y="446" width="300" height="10" rx="5" fill="#E2D6C3"/>

  <g transform="translate(256 452) scale(0.9) translate(-256 -452) translate(26 -6) rotate(-20 222 412)">
    <!-- Ruota posteriore -->
    <circle cx="262" cy="390" r="44" fill="#1F1D1B"/>
    <circle cx="262" cy="390" r="13" fill="#CFC2AC"/>


    <!-- Telaio con manico arrotondato -->
    <path d="M244 378 V68 C244 4 204 4 204 68 V400" fill="none" stroke="#3E3A36"
          stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M244 72 C244 8 204 8 204 72" fill="none" stroke="#2B2826"
          stroke-width="24" stroke-linecap="round"/>


    <!-- Piedini uniti da barra -->
    <path d="M362 370 L372 404 Q376 418 364 424 L348 432 Q336 438 332 426 L322 392" fill="none" stroke="#3E3A36"
          stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Base (sopra le gambe) -->
    <rect x="200" y="390" width="144" height="14" rx="7" fill="#3E3A36"/>

    <!-- Tessuto: faccia frontale -->
    <path d="M308 140 L348 118 L378 362 L342 384 Z" fill="#8E3026" stroke="#8E3026" stroke-width="16" stroke-linejoin="round"/>

    <!-- Tessuto: fianco -->
    <path d="M240 140 H280 Q308 140 307 170 L342 380 Q343 392 332 392 H242 Q210 392 210 362 V170 Q210 140 240 140 Z" fill="#A93A2E"/>

    <!-- Chiusura a L: pezzo unico allineato al sacco -->
    <path d="M218 160 L218 140 L256 118 L348 118 L362 226 L322 248 L311 160 Z" fill="#7E2A21" stroke="#7E2A21" stroke-width="16" stroke-linejoin="round"/>

    <!-- Cinghietta e fibbia -->
    <path d="M339 237 L346 233 L353 289 L347 293 Z" fill="#6A231B" stroke="#6A231B" stroke-width="4" stroke-linejoin="round"/>
    <path d="M337 243 L349 236 L353 268 L341 275 Z" fill="none" stroke="#EADCC4" stroke-width="5" stroke-linejoin="round"/>

    <!-- Tasca -->
    <path d="M248 286 H314 Q326 286 327 298 L332 350 Q333 364 319 364 H245 Q231 364 232 350 L234 298 Q235 286 248 286 Z" fill="#963227"/>
    <path d="M248 286 H314 Q326 286 327 298 L327.4 302 H234.4 L234 298 Q235 286 248 286 Z" fill="#8C2D23"/>

    <!-- Barra frontale sotto il tessuto -->
    <path d="M337 397 L374 376" fill="none" stroke="#3E3A36" stroke-width="14" stroke-linecap="round"/>

    <!-- Ruota anteriore -->
    <circle cx="222" cy="412" r="46" fill="#2B2826"/>
    <circle cx="222" cy="412" r="30" fill="none" stroke="#4A4541" stroke-width="6"/>
    <circle cx="222" cy="412" r="14" fill="#EADCC4"/>
  </g>
  </g>
</svg>
