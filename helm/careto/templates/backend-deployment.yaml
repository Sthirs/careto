apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "careto.fullname" . }}-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "careto.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.defaultPodOptions }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if not .Values.devMode.enabled }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      {{- if and .Values.dex.enabled .Values.devMode.enabled }}
      initContainers:
        - name: wait-for-dex
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q -O /dev/null http://careto-dex.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.dex.service.port }}/dex/.well-known/openid-configuration; do
                echo "waiting for dex..."; sleep 2
              done
      {{- end }}
      volumes:
        - name: backend-tmp
          emptyDir: {}
      containers:
        #trivy:ignore:KSV-0125
        - name: backend
          image: {{ include "careto.imageRepository" (dict "root" . "image" .Values.backend.image "component" "backend") }}:{{ include "careto.imageTag" (dict "root" . "image" .Values.backend.image) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          {{- if not .Values.devMode.enabled }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          {{- end }}
          volumeMounts:
            - name: backend-tmp
              mountPath: /tmp
          ports:
            - containerPort: {{ .Values.backend.service.targetPort }}
          env:
            - name: PORT
              value: {{ include "careto.backendEnvValue" (dict "root" . "key" "PORT") | quote }}
            - name: NODE_ENV
              value: {{ include "careto.backendEnvValue" (dict "root" . "key" "NODE_ENV") | quote }}
            - name: DB_SYNC
              value: {{ include "careto.backendEnvValue" (dict "root" . "key" "DB_SYNC") | quote }}
            - name: SEED_ON_STARTUP
              value: {{ include "careto.backendEnvValue" (dict "root" . "key" "SEED_ON_STARTUP") | quote }}
            - name: AUTH_LOCAL_LOGIN_ENABLED
              value: {{ include "careto.backendEnvValue" (dict "root" . "key" "AUTH_LOCAL_LOGIN_ENABLED") | quote }}
            - name: AUTH_LOCAL_REGISTRATION_ENABLED
              value: {{ include "careto.backendEnvValue" (dict "root" . "key" "AUTH_LOCAL_REGISTRATION_ENABLED") | quote }}
            - name: RATE_LIMIT_WINDOW_MS
              value: {{ include "careto.backendEnvValue" (dict "root" . "key" "RATE_LIMIT_WINDOW_MS") | quote }}
            - name: RATE_LIMIT_LIMIT
              value: {{ include "careto.backendEnvValue" (dict "root" . "key" "RATE_LIMIT_LIMIT") | quote }}
            - name: AUTO_FILL_ENABLED
              value: {{ include "careto.backendEnvValue" (dict "root" . "key" "AUTO_FILL_ENABLED") | quote }}
            - name: AUTO_FILL_INTERVAL_MS
              value: {{ include "careto.backendEnvValue" (dict "root" . "key" "AUTO_FILL_INTERVAL_MS") | quote }}
            - name: ACCESS_TOKEN_TTL_SECONDS
              value: {{ include "careto.backendEnvValue" (dict "root" . "key" "ACCESS_TOKEN_TTL_SECONDS") | quote }}
            - name: REFRESH_TOKEN_TTL_SECONDS
              value: {{ include "careto.backendEnvValue" (dict "root" . "key" "REFRESH_TOKEN_TTL_SECONDS") | quote }}
            - name: REFRESH_TOKEN_REUSE_GRACE_SECONDS
              value: {{ include "careto.backendEnvValue" (dict "root" . "key" "REFRESH_TOKEN_REUSE_GRACE_SECONDS") | quote }}
            - name: CORS_ORIGIN
              value: {{ include "careto.backendEnvValue" (dict "root" . "key" "CORS_ORIGIN") | quote }}
            - name: DB_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "careto.backendDatabaseSecretName" . }}
                  key: {{ include "careto.backendSecretKey" (dict "root" . "type" "hostname") }}
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ include "careto.backendDatabaseSecretName" . }}
                  key: {{ include "careto.backendSecretKey" (dict "root" . "type" "port") }}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "careto.backendDatabaseSecretName" . }}
                  key: {{ include "careto.backendSecretKey" (dict "root" . "type" "username") }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "careto.backendDatabaseSecretName" . }}
                  key: {{ include "careto.backendSecretKey" (dict "root" . "type" "password") }}
            - name: DB_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "careto.backendDatabaseSecretName" . }}
                  key: {{ include "careto.backendSecretKey" (dict "root" . "type" "databaseName") }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "careto.backendJwtSecretName" . }}
                  key: {{ include "careto.backendSecretKey" (dict "root" . "type" "jwt") }}
            - name: FRONTEND_URL
              value: {{ include "careto.backendEnvValue" (dict "root" . "key" "FRONTEND_URL") | quote }}
            - name: OAUTH_CONFIG
              valueFrom:
                secretKeyRef:
                  name: {{ include "careto.backendOauthSecretName" . }}
                  key: {{ include "careto.backendSecretKey" (dict "root" . "type" "oauthConfig") }}
                  optional: true
            - name: OAUTH_STATE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "careto.backendOauthSecretName" . }}
                  key: {{ include "careto.backendSecretKey" (dict "root" . "type" "oauthStateSecret") }}
                  optional: true
            - name: VAPID_SUBJECT
              value: {{ include "careto.backendEnvValue" (dict "root" . "key" "VAPID_SUBJECT") | quote }}
            - name: VAPID_AUTO_GENERATE
              value: {{ include "careto.backendEnvValue" (dict "root" . "key" "VAPID_AUTO_GENERATE") | quote }}
            - name: PUSH_ENDPOINT_ALLOWLIST
              value: {{ include "careto.backendEnvValue" (dict "root" . "key" "PUSH_ENDPOINT_ALLOWLIST") | quote }}
            # ADR-0020: push degrades to a no-op when these are unset, same as
            # OAUTH_CONFIG/OAUTH_STATE_SECRET above — `optional: true` lets the
            # pod start against a secret that has not provisioned them yet.
            - name: VAPID_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "careto.backendVapidSecretName" . }}
                  key: {{ include "careto.backendSecretKey" (dict "root" . "type" "vapidPublicKey") }}
                  optional: true
            - name: VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "careto.backendVapidSecretName" . }}
                  key: {{ include "careto.backendSecretKey" (dict "root" . "type" "vapidPrivateKey") }}
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.backend.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
