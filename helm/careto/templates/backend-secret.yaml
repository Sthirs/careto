{{- if .Values.devMode.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "careto.fullname" . }}-backend
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  DB_HOSTNAME: {{ printf "%s-postgres" (include "careto.fullname" .) | quote }}
  DB_PORT: {{ .Values.postgres.service.port | quote }}
  DB_USERNAME: "postgres"
  DB_PASSWORD: "postgres"
  DB_DATABASE_NAME: "careto"
  JWT_SECRET: {{ include "careto.backendEnvValue" (dict "root" . "key" "JWT_SECRET") | quote }}
  {{- if .Values.dex.enabled }}
  OAUTH_CONFIG: {{ dict "autoLaunch" false "autoRegister" true "buttonText" "Sign in with Dex" "clientId" "careto" "clientSecret" "careto-dev-secret" "enabled" true "issuerUrl" (printf "http://%s/dex" .Values.ingress.host) "scope" "openid email profile" | toJson | quote }}
  OAUTH_STATE_SECRET: "change-me-dev-state-secret"
  {{- else }}
  OAUTH_CONFIG: ""
  OAUTH_STATE_SECRET: ""
  {{- end }}
{{- end }}
