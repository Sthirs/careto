{{- if and .Values.postgres.enabled .Values.devMode.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "careto.fullname" . }}-postgres
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_DB: "careto"
{{- end }}
